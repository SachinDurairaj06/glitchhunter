AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GlitchHunter: agentic visual QA with OpenCV 5 on an AWS Graviton instance.
  EC2 (arm64) runs the agent, headless game captures and the dashboard; S3 keeps hunt
  artifacts; Amazon Bedrock hosts the Claude planner; CloudWatch receives logs and EMF metrics.

Parameters:
  InstanceType:
    Type: String
    Default: c7g.xlarge
    AllowedValues: [c7g.large, c7g.xlarge, c7g.2xlarge, m7g.large, m7g.xlarge, c8g.large, c8g.xlarge, m8g.xlarge]
    Description: Graviton (arm64) instance type.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >-
      arm64 AMI (latest Amazon Linux 2023 by default). The COOL benchmark runs natively on a
      separate COOL instance from AWS Marketplace; see deploy/README.md.
  AllowedCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: Only this CIDR can reach the dashboard (for example your.ip.address/32).
  RepoUrl:
    Type: String
    Description: HTTPS git URL of this repository.
  RepoRef:
    Type: String
    Default: main
  Planner:
    Type: String
    Default: bedrock
    AllowedValues: [rule, bedrock]
  BedrockModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
  Game:
    Type: String
    Default: ironworks
    AllowedValues: [crypt, ironworks]
    Description: Built-in test game the dashboard hunts in.
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Bearer token required for every POST (open the dashboard as /?token=<token>).

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: expire-hunt-artifacts
            Status: Enabled
            ExpirationInDays: 30

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /glitchhunter/${AWS::StackName}
      RetentionInDays: 30

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore  # shell access through Session Manager, no SSH
      Policies:
        - PolicyName: glitchhunter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: HuntArtifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${ArtifactBucket.Arn}/glitchhunter/*
              - Sid: ListArtifacts
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ClaudeOnBedrock
                Effect: Allow
                Action: bedrock-mantle:CreateInference  # Messages API endpoint (bedrock-mantle)
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt LogGroup.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GlitchHunter dashboard
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref AllowedCidr

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
        HttpPutResponseHopLimit: 2    # lets the container reach the instance role
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true}
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-glitchhunter"}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          if command -v dnf >/dev/null; then dnf install -y docker git; else apt-get update && apt-get install -y docker.io git; fi
          systemctl enable --now docker
          git clone --depth 1 --branch "${RepoRef}" "${RepoUrl}" /opt/glitchhunter
          docker build -f /opt/glitchhunter/deploy/Dockerfile -t glitchhunter /opt/glitchhunter
          mkdir -p /opt/gh-data && chown 10001:10001 /opt/gh-data
          docker run -d --name glitchhunter --restart unless-stopped -p 8000:8000 --shm-size 1g \
            -v /opt/gh-data:/data \
            --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${LogGroup} \
            -e AWS_REGION=${AWS::Region} \
            -e GH_PLANNER=${Planner}             -e GH_GAME=${Game} \
            -e GH_BEDROCK_MODEL_ID=${BedrockModelId} \
            -e GH_S3_BUCKET=${ArtifactBucket} \
            -e GH_API_TOKEN='${ApiToken}' \
            -e GH_OPENCV_DIST=pip \
            glitchhunter serve

Outputs:
  DashboardUrl:
    Description: Open with ?token=<ApiToken> to allow starting hunts and approving findings.
    Value: !Sub http://${Instance.PublicDnsName}:8000/
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  LogGroup:
    Value: !Ref LogGroup
  InstanceId:
    Value: !Ref Instance
